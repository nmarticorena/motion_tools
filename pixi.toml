[workspace]
authors = ["nmarticorena <nicolas.marticorena.vidal@gmail.com>"]
channels = ["conda-forge"]
name = "motion_tools"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.3"

[environments]
dev = ["dev"]

[pypi-options]
no-build-isolation = true

[tasks]

[dependencies]
rerun-sdk = ">=0.29.1,<0.30"
numpy = ">=2,<3"
python = "==3.10"
tyro = ">=1.0.6,<2"
hatchling = ">=1.28.0,<2"
scipy = ">=1.14.0,<2"
pdbpp = ">=0.12.0.post1,<0.13"
urdfpy = ">=0.0.22,<0.0.23"
proxsuite = ">=0.7.2,<0.8"
setuptools = ">=82.0.0,<83"

[pypi-dependencies]
motion-tools = { path = "./" , editable = true}
general_motion_retargeting = {path = "./GMR/", editable=true}

[feature.dev.dependencies]
pre-commit = "*"
ruff = ">=0.15.0,<0.16"

[feature.dev.tasks]
clean = "ruff format"
