name: Package

on:
    workflow_dispatch:
    push:
        tags:
            - "*"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
    - name: Build conda package
      uses: prefix-dev/rattler-build-action@v0.2.34
      with:
          recipe-path: "recipe.yaml"
          build-args: --experimental
    - name: Upload anaconda
      run: |
          for file in output/**/*.conda; do
            rattler-build upload anaconda "$file" || true
          done
      env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
